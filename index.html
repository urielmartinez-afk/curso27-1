    // --- HELPER CALCULATIONS ---
    function calculateExamen1Derecho(examenObj) {
      if (!examenObj) return 0;
      if (typeof examenObj === 'number') return examenObj;
      const s1 = Object.values(examenObj.sec1 || {}).reduce((a, b) => Number(a) + Number(b), 0);
      const s2 = Number(examenObj.sec2 || 0);
      const s3 = Object.values(examenObj.sec3 || {}).reduce((a, b) => Number(a) + Number(b), 0);
      const s4 = Object.values(examenObj.sec4 || {}).reduce((a, b) => Number(a) + Number(b), 0);
      return Math.min(10, s1 + s2 + s3 + s4);
    }

    function calculateExamen1Psicologia(examenObj) {
      if (!examenObj) return 0;
      if (typeof examenObj === 'number') return examenObj;
      const s1 = Object.values(examenObj.sec1 || {}).reduce((a, b) => Number(a) + Number(b), 0);
      const s2 = Object.values(examenObj.sec2 || {}).reduce((a, b) => Number(a) + Number(b), 0);
      const s3 = Object.values(examenObj.sec3 || {}).reduce((a, b) => Number(a) + Number(b), 0);
      const s4 = Object.values(examenObj.sec4 || {}).reduce((a, b) => Number(a) + Number(b), 0);
      const s5 = Object.values(examenObj.sec5 || {}).reduce((a, b) => Number(a) + Number(b), 0);
      return Math.min(10, s1 + s2 + s3 + s4 + s5);
    }

    function calculateProyecto1Psicologia(projObj) {
      if (!projObj) return 0;
      if (typeof projObj === 'number') return projObj;
      return Object.values(projObj).reduce((a, b) => Number(a) + Number(b), 0);
    }

    function calculateParcial1(student) {
      if (!student || !student.parcial1) return 0;
      let scoreExamen = 0;
      let scoreProyecto = 0;

      if (student.carrera === 'derecho_admin') {
        scoreExamen = calculateExamen1Derecho(student.parcial1.examen);
        scoreProyecto = Number(student.parcial1.proyecto || 0);
      } else {
        scoreExamen = calculateExamen1Psicologia(student.parcial1.examen);
        scoreProyecto = calculateProyecto1Psicologia(student.parcial1.proyecto);
      }

      const extra = Number(student.parcial1.extra || 0);
      const total = (scoreExamen * 0.60) + (scoreProyecto * 0.40) + extra;
      return Math.min(10, Math.round(total * 100) / 100);
    }

    function calculateParcial2(student) {
      if (!student || !student.parcial2) return 0;
      const examen = Number(student.parcial2.examen || 0);
      const proyecto = Number(student.parcial2.proyecto || 0);
      const extra = Number(student.parcial2.extra || 0);
      const total = (examen * 0.60) + (proyecto * 0.40) + extra;
      return Math.min(10, Math.round(total * 100) / 100);
    }

    function calculatePromedioGlobal(student) {
      const p1 = calculateParcial1(student);
      const p2 = calculateParcial2(student);
      return Math.round(((p1 + p2) / 2) * 100) / 100;
    }

          s.correo.toLowerCase() === query

        setHasSearched(true);

    // =========================================================================

    function AdminDashboard({ students, setStudents, adminTab, setAdminTab }) {
      const [filterCareer, setFilterCareer] = useState('all');
      const [importText, setImportText] = useState('');
      const [importMessage, setImportMessage] = useState(null);

      // Filtering students
      const filteredStudents = useMemo(() => {
        if (filterCareer === 'all') return students;
        return students.filter(s => s.carrera === filterCareer);
      }, [students, filterCareer]);

      // Delete student
      const handleDeleteStudent = (id) => {
        if (window.confirm("¿Seguro que deseas eliminar este registro de alumno?")) {
          setStudents(prev => prev.filter(s => s.id !== id));
        }
      };

      // Reset to initial seed
      const handleResetData = () => {
        if (window.confirm("¿Deseas restaurar los alumnos con la información de demostración inicial? Se borrarán tus cambios.")) {
          setStudents(INITIAL_STUDENTS);
        }
      };

      // Generate Template CSV for Download
      const downloadCSVTemplate = (carrera) => {
        let headers = [];
        let filename = "";

        if (carrera === 'derecho_admin') {
          headers = [
            "Matricula", "Nombre", "Correo",
            "Examen1_Sec1_R1", "Examen1_Sec1_R2", "Examen1_Sec1_R3", "Examen1_Sec1_R4",
            "Examen1_Sec2",
            "Examen1_Sec3_Caso1", "Examen1_Sec3_Caso2", "Examen1_Sec3_Caso3",
            "Examen1_Sec4_A", "Examen1_Sec4_B",
            "Proyecto1", "Extra1",
            "Examen2", "Proyecto2", "Extra2"
          ];
          filename = "plantilla_calificaciones_derecho_admin.csv";
        } else {
          headers = [
            "Matricula", "Nombre", "Correo",
            "Examen1_Sec1_R1",
            "Examen1_Sec2_R1", "Examen1_Sec2_R2", "Examen1_Sec2_R3", "Examen1_Sec2_R4", "Examen1_Sec2_R5", "Examen1_Sec2_R6",
            "Examen1_Sec3_R1",
            "Examen1_Sec4_R1",
            "Examen1_Sec5_R1", "Examen1_Sec5_R2", "Examen1_Sec5_R3",
            "Proyecto1_Crit1", "Proyecto1_Crit2", "Proyecto1_Crit3", "Extra1",
            "Examen2", "Proyecto2", "Extra2"
          ];
          filename = "plantilla_calificaciones_psicologia_ind.csv";
        }

        const csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\n";
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // CSV Auto-Parse Import
      const handleCSVImport = (careerType) => {
        if (!importText.trim()) {
          setImportMessage({ type: 'error', text: 'Por favor pega o carga el contenido en texto del CSV exportado de Google Sheets.' });
          return;
        }

        Papa.parse(importText.trim(), {
          header: true,
          skipEmptyLines: true,
          complete: (results) => {
            if (results.errors.length > 0 && results.data.length === 0) {
              setImportMessage({ type: 'error', text: 'Error al interpretar el formato CSV. Revisa las columnas.' });
              return;
            }

            try {

// Reemplaza esta URL con la que te dio Google Apps Script al desplegar
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzW3vHOLFlbLKCOJH8-0NmA-O34DPkmB9yWdPFMzQTOHsx_i8qm-gBjwey4D8rEIwOl/exec";

// Carga en segundo plano los datos desde Google Sheets cada vez que se busca un alumno
async function obtenerDatosGoogleSheets() {
  try {
    const respuesta = await fetch(GOOGLE_SCRIPT_URL);
    if (!respuesta.ok) throw new Error("Error en la respuesta de red");
    
    const datos = await respuesta.json();
    if (Array.isArray(datos) && datos.length > 0) {
      // Guarda copia en el almacenamiento local para respaldo
      localStorage.setItem("alumnos_db", JSON.stringify(datos));
      return datos;
    }
  } catch (err) {
    console.warn("No se pudo conectar a Google Sheets. Usando datos guardados localmente.", err);
  }
  
  const datosLocales = localStorage.getItem("alumnos_db");
  return datosLocales ? JSON.parse(datosLocales) : [];
}

// Intercepta la consulta del alumno para traer la información más reciente de Sheets
document.addEventListener("DOMContentLoaded", () => {
  const btnBuscar = document.querySelector("button[onclick*='buscar']"), 
        inputBusqueda = document.querySelector("input[type='text']");

  if (btnBuscar && inputBusqueda) {
    btnBuscar.onclick = async (e) => {
      e.preventDefault();
      const busqueda = inputBusqueda.value.trim().toLowerCase();
      
      if (!busqueda) {
        alert("Por favor ingresa tu matrícula o correo.");
        return;
      }

      // Despliega mensaje de carga temporal
      const contenedorResultado = document.getElementById("resultado") || document.querySelector("main");
      
      const alumnosActualizados = await obtenerDatosGoogleSheets();
      
      // Busca coincidencia por matrícula o correo
      const alumnoEncontrado = alumnosActualizados.find(a => 
        String(a.matricula || a.Matricula || '').toLowerCase() === busqueda || 
        String(a.correo || a.Correo || '').toLowerCase() === busqueda
      );

      if (alumnoEncontrado) {
        // Renderiza los datos encontrados
        if (typeof renderizarFicha === "function") {
          renderizarFicha(alumnoEncontrado);
        } else if (typeof mostrarResultado === "function") {
          mostrarResultado(alumnoEncontrado);
        } else {
          location.reload(); // Recarga para actualizar con la base en localStorage
        }
      } else {
        alert("No se encontró ningún alumno con la matrícula o correo ingresado.");
      }
    };
  }
});
